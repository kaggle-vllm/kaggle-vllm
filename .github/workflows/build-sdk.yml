name: Build local Python distribution artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Archive built distributions
        uses: actions/upload-artifact@v7
        with:
          name: local-sdk-distributions
          path: dist/
          if-no-files-found: error
