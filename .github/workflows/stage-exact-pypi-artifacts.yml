name: Stage exact accepted PyPI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - name: Reuse exact published PyPI distributions
        id: state
        run: python scripts/release_state.py pypi

  stage:
    needs: preflight
    if: needs.preflight.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only to principals with push access.
      contents: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify source lineage and owner-staged draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release-by-tag endpoint returns 404 for drafts. List releases
          # with the repository token, then select exactly this draft tag.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "sdk-v0.3.1-stage")' > staging-release.json
          python - <<'PY'
          import json
          release = json.load(open('staging-release.json'))
          if not release.get('draft') or release.get('published_at') is not None:
              raise SystemExit('staging release must remain a draft')
          if release.get('tag_name') != 'sdk-v0.3.1-stage':
              raise SystemExit('unexpected staging tag')
          if len(release.get('assets', [])) != 2:
              raise SystemExit('draft release must contain exactly two assets')
          PY
          staged_source_sha="$(git rev-list -n 1 sdk-v0.3.1-stage)"
          # The draft tag must point at the exact reviewed main commit.
          test "$staged_source_sha" = "$GITHUB_SHA"
          mkdir -p dist
          gh release download sdk-v0.3.1-stage --dir dist --pattern 'kaggle_vllm-0.3.1*'
          python scripts/release_state.py verify-dir dist
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: v031-exact-pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
