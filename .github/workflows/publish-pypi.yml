name: Publish exact Python distribution to PyPI

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful main-branch stage-exact-pypi-artifacts run ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - name: Reuse exact published PyPI distributions
        id: state
        run: python scripts/release_state.py pypi

  publish:
    needs: preflight
    if: needs.preflight.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify accepted source commit and staging run
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" > staging-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('staging-run.json'))
          expected = {
              'event': 'workflow_dispatch', 'conclusion': 'success',
              'head_branch': 'main', 'head_sha': os.environ['GITHUB_SHA'],
              'path': '.github/workflows/stage-exact-pypi-artifacts.yml',
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f'staging run {key} mismatch: {run.get(key)!r}')
          if run.get('repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('staging run belongs to another repository')
          PY
      - name: Download only the verified staging artifact
        uses: actions/download-artifact@v8
        with:
          name: v031-exact-pypi-distributions
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify exact accepted bytes immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release_state.py verify-dir dist
          for artifact in dist/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/stage-exact-pypi-artifacts.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners > /dev/null
          done
      - name: Recheck PyPI identity immediately before upload
        id: late_state
        run: python scripts/release_state.py pypi
      - name: Publish exact accepted distributions
        if: steps.late_state.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
