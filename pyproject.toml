[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-vllm"
version = "0.1.0"
description = "A lightweight Kaggle compatibility SDK around upstream vLLM for Tesla T4 GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "vllm-kaggle contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
hub = ["huggingface_hub>=0.36"]

[project.urls]
Documentation = "https://github.com/vllm-kaggle/vllm-kaggle-nvidia-dual-t4-gpus/tree/main/docs"
Repository = "https://github.com/vllm-kaggle/vllm-kaggle-nvidia-dual-t4-gpus"
Issues = "https://github.com/vllm-kaggle/vllm-kaggle-nvidia-dual-t4-gpus/issues"
Changelog = "https://github.com/vllm-kaggle/vllm-kaggle-nvidia-dual-t4-gpus/blob/main/CHANGELOG.md"
"Hugging Face binaries" = "https://huggingface.co/waqasm86/vllm-kaggle-binaries"
"Hugging Face TP=2 model" = "https://huggingface.co/waqasm86/vllm-kaggle-models"

[project.scripts]
kaggle-vllm = "kaggle_vllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaggle_vllm = ["profiles/*/*.json", "profiles/*/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a real CUDA GPU runtime",
  "kaggle: requires the documented Kaggle environment",
]
