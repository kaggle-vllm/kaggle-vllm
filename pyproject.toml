[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-vllm"
version = "0.3.0"
description = "A Kaggle L4x4 compatibility and offline runtime-delivery SDK for upstream vLLM."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [{name = "kaggle-vllm contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["packaging>=23"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "twine>=6"]

[project.urls]
Documentation = "https://github.com/kaggle-vllm/kaggle-vllm/tree/main/docs"
Repository = "https://github.com/kaggle-vllm/kaggle-vllm"
Issues = "https://github.com/kaggle-vllm/kaggle-vllm/issues"
Changelog = "https://github.com/kaggle-vllm/kaggle-vllm/blob/main/CHANGELOG.md"

[project.scripts]
kaggle-vllm = "kaggle_vllm.cli_v3:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaggle_vllm = ["profiles/kaggle-l4x4-cu129/*.json", "profiles/kaggle-l4x4-cu129/*.txt", "profiles/kaggle-t4x2-cu128/*.json", "profiles/kaggle-t4x2-cu128/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a real CUDA GPU runtime",
  "kaggle: requires the documented Kaggle environment",
]

[tool.ruff]
extend-exclude = ["*.ipynb", "artifacts/**"]
