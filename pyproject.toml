[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-vllm"
version = "0.1.0.dev0"
description = "Kaggle-native vLLM build and compatibility toolkit for dual NVIDIA Tesla T4 GPUs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
kaggle-vllm = "kaggle_vllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
